<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b9e4df" />
    <title>물멍 · WATER THERAPY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="water-stage" aria-label="물멍 테라피">
      <div
        id="water-canvas"
        class="canvas-host"
        role="img"
        aria-label="햇빛이 비치는 청록색 물 표면. 마우스를 움직이거나 누르면 물결이 퍼집니다."
      >
        <p id="canvas-fallback" class="fallback">
          물 표면을 불러오지 못했습니다. 페이지를 새로고침해 주세요.
        </p>
      </div>
      <div class="stage-shade" aria-hidden="true"></div>

      <header class="site-header">
        <div class="header-line">
          <button id="back" class="back-button" type="button" aria-label="이전 페이지로">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7" /></svg>
          </button>
          <span class="header-divider" aria-hidden="true"></span>
          <span class="brand">WATER THERAPY</span>
          <span class="header-category">물의 테라피</span>
        </div>
        <div class="title-section">
          <p class="eyebrow">A MOMENT BY THE WATER</p>
          <h1>물멍</h1>
          <p class="lede">손끝에 번지는 물결을 바라보며<br class="mobile-break" /> 천천히 쉬어 가요.</p>
        </div>
      </header>

      <section class="control-dock" aria-label="물멍 조절">
        <div class="sound-options" role="radiogroup" aria-label="물의 공간 선택">
          <button type="button" class="sound-btn" role="radio" data-sound="lake" aria-checked="true" tabindex="0">
            호수
          </button>
          <button type="button" class="sound-btn" role="radio" data-sound="river" aria-checked="false" tabindex="-1">
            시냇물
          </button>
          <button type="button" class="sound-btn" role="radio" data-sound="ocean" aria-checked="false" tabindex="-1">
            바다
          </button>
        </div>
        <span id="sound-now" class="visually-hidden">잔잔한 호수</span>

        <div class="dock-tools">
          <button id="play" class="tool-button play-button" type="button" aria-pressed="false">
            <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5z" /></svg>
            <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" /></svg>
            <span id="play-label">소리 듣기</span>
          </button>
          <button id="motion-toggle" class="tool-button motion-button" type="button" aria-pressed="false">
            <svg class="icon icon-motion" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12m6-12v12" /></svg>
            <span id="motion-label">움직임 멈추기</span>
          </button>
          <button id="mute" class="tool-button icon-button" type="button" aria-pressed="false" aria-label="음소거">
            <svg class="icon icon-volume" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10v4h4l5 4V6l-5 4H4z" />
              <path class="volume-wave" d="M16 9a5 5 0 0 1 0 6M18.5 6.5a8.5 8.5 0 0 1 0 11" />
              <path class="volume-muted" d="m16 9 5 6m0-6-5 6" />
            </svg>
          </button>
          <div class="volume-control">
            <label class="visually-hidden" for="volume">물소리 음량</label>
            <input id="volume" type="range" min="0" max="100" value="70" aria-valuetext="70%" />
            <span class="visually-hidden"><span id="volume-value">70</span>%</span>
          </div>
        </div>
        <p id="water-status" class="water-status" aria-live="polite">수면이 잔잔하게 움직이고 있어요.</p>
        <p id="audio-status" class="audio-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js" defer></script>
    <script src="sketch.js" defer></script>
    <script src="ui.js" defer></script>
  </body>
</html>
